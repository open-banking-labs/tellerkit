name: gate

# CI 与本地跑同一条命令：npm run gate。
# 门禁结论只认 exit code，不认任何人的"已通过"。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # 柜面的实际部署平台是 Windows，Linux 不是目标平台。
    # 之前用 ubuntu 要 apt 装 WebKitGTK，两次卡在 apt 上十几分钟——为不存在的平台付出代价。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: npm ci

      - name: 核心逻辑测试
        run: cargo test --workspace

      - name: 生成物必须与源码同步
        run: |
          npm run bindings
          git diff --exit-code -- apps/shell/src/generated

      - name: 前端类型检查与打包
        run: npm run build

      - name: 门禁
        run: npm run gate

      - name: 派发指标（信息性）
        run: npm run metrics
