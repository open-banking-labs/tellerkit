name: gate

# gate 是本地静态预检：exit 0 只代表静态检查通过，不代表编译/测试通过。
# 合并裁决 = 分支保护要求的 CI checks（test / clippy / bindings / build / gate 全绿）。
# 门禁结论只认 exit code，不认任何人的"已通过"。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # 柜面的实际部署平台是 Windows，Linux 不是目标平台。
    # 之前用 ubuntu 要 apt 装 WebKitGTK，两次卡在 apt 上十几分钟——为不存在的平台付出代价。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 变更保护要能拿到 PR base / push before 那次提交
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: 安装依赖
        run: npm ci

      # 宪法第 1 条：契约只能由人改，且必须留下提案。PR 用 base.sha，
      # push 用 event.before；取不到基线（新分支/浅克隆）时退回 HEAD^。
      - name: 契约变更必须带提案
        shell: bash
        run: |
          set -eu
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "契约 diff 基线：$base"
          changed="$(git diff --name-only "$base" HEAD -- contracts || true)"
          if [ -n "$changed" ]; then
            echo "本次改动了 contracts/："
            echo "$changed"
            proposals="$(git diff --diff-filter=A --name-only "$base" HEAD -- changes | grep -E '^changes/[^/]+\.md$' || true)"
            if [ -z "$proposals" ]; then
              echo "::error::contracts/** 有变更但没有新增 changes/*.md 提案（宪法第 1 条）"
              exit 1
            fi
            echo "已新增提案：$proposals"
          else
            echo "contracts/** 未变更"
          fi

      - name: 核心逻辑测试
        run: cargo test --workspace --locked

      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 生成物必须与源码同步
        run: |
          npm run bindings
          git diff --exit-code -- apps/shell/src/generated

      - name: 前端类型检查与打包
        run: npm run build

      - name: 门禁
        run: npm run gate

      - name: 派发指标（信息性）
        run: npm run metrics
