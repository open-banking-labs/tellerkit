name: gate

# CI 与本地跑同一条命令：npm run gate。
# 门禁结论只认 exit code，不认任何人的"已通过"。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tauri 在 Linux 上编译需要 WebKitGTK 等系统库，缺了 cargo test 会直接失败
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装依赖
        run: npm ci

      - name: 核心逻辑测试
        run: cargo test --workspace

      - name: 生成物必须与源码同步
        run: |
          npm run bindings
          git diff --exit-code -- apps/shell/src/generated

      - name: 前端类型检查与打包
        run: npm run build

      - name: 三道门禁
        run: npm run gate
