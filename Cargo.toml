[workspace]
resolver = "2"
members = ["apps/shell/src-tauri", "packages/core", "tools/mtree-tool"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
rand = "0.8"
ts-rs = { version = "12", features = ["serde-compat"] }
